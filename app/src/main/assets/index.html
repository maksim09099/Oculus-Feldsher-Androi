<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Окулус-Фельдшер — цифровая предоперационная подготовка</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --line: #d9e2ef;
      --text: #1f2a3d;
      --muted: #5b6b82;
      --primary: #1f5fa8;
      --success: #1f9d55;
      --warning: #b57f00;
      --danger: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      font-size: 17px;
    }
    .container { max-width: 1260px; margin: 0 auto; padding: 16px; }
    .topbar {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }
    .title { font-size: 1.35rem; font-weight: 700; }
    .subtitle { color: var(--muted); font-size: 0.95rem; margin-top: 4px; }
    .roles { display: flex; gap: 8px; flex-wrap: wrap; }
    button, select, input, textarea {
      font: inherit;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fff;
    }
    button { cursor: pointer; }
    .btn-primary { background: var(--primary); color: white; border-color: var(--primary); }
    .btn-outline { background: #fff; color: var(--primary); }
    .active-role { outline: 3px solid #c6daf6; }

    .grid { display: grid; gap: 14px; margin-top: 14px; }
    .grid-2 { grid-template-columns: 1.3fr 1fr; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
    }
    .card h2, .card h3 { margin: 0 0 10px; font-size: 1.08rem; }
    .badge { padding: 5px 10px; border-radius: 999px; color: white; font-weight: 700; display: inline-flex; }
    .red { background: var(--danger); }
    .yellow { background: var(--warning); }
    .green { background: var(--success); }

    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    th, td { border-bottom: 1px solid var(--line); text-align: left; padding: 8px 6px; vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }

    .check-item { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 8px; }
    .check-head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .muted { color: var(--muted); }
    .small { font-size: 0.87rem; }

    .field-row { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; margin-bottom: 8px; }
    .field-row-4 { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }

    .pill {
      display: inline-flex; align-items: center; gap: 8px;
      border: 1px dashed var(--line);
      padding: 8px 10px; border-radius: 10px;
    }

    .timeline { list-style: none; padding: 0; margin: 0; }
    .timeline li { padding: 10px; border-left: 4px solid #c4d4eb; background: #f9fbff; margin-bottom: 8px; border-radius: 8px; }

    @media (max-width: 980px) {
      .grid-2 { grid-template-columns: 1fr; }
      .field-row, .field-row-4 { grid-template-columns: 1fr; }
      body { font-size: 18px; }
      button, select, input, textarea { min-height: 44px; }
    }
  </style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <div>
      <div class="title">Окулус-Фельдшер</div>
      <div class="subtitle">Удаленная подготовка к офтальмологическим операциям между районами и областным центром</div>
    </div>
    <div class="roles">
      <button id="roleF" class="btn-outline">Роль: Фельдшер</button>
      <button id="roleS" class="btn-outline">Роль: Хирург</button>
      <button id="roleP" class="btn-outline">Роль: Пациент</button>
    </div>
  </header>

  <section id="viewF" class="grid grid-2"></section>
  <section id="viewS" class="grid" style="display:none"></section>
  <section id="viewP" class="grid" style="display:none"></section>
</div>

<script>
(() => {
  const operationTemplates = {
    "Факоэмульсификация": ["Анализ крови: глюкоза, гемоглобин", "ЭКГ с расшифровкой", "Флюорография", "Осмотр терапевта", "Бакпосев из глаза", "Расчет ИОЛ"],
    "Антиглаукоматозная операция": ["Анализ крови: глюкоза, гемоглобин", "ЭКГ с расшифровкой", "Осмотр терапевта", "ОКТ/тонометрия", "Бакпосев из глаза", "Расчет ИОЛ"],
    "Витреоретинальная операция": ["Анализ крови", "ЭКГ", "Флюорография", "Осмотр терапевта", "Фото глазного дна", "Расчет ИОЛ"]
  };

  const defaultPatients = [
    { id: "P-001", fio: "Иванов Сергей", district: "Каменский", diagnosis: "H25.0", snils: "123-456-789 11", policy: "ОМС-90872", operation: "Факоэмульсификация", status: "yellow", stage: 2, surgeryDate: "", surgeonComment: "", checklist: {}, files: {}, iol: null },
    { id: "P-002", fio: "Петрова Анна", district: "Талицкий", diagnosis: "H40.1", snils: "321-654-987 33", policy: "ОМС-44122", operation: "Антиглаукоматозная операция", status: "red", stage: 1, surgeryDate: "", surgeonComment: "Нужна консультация эндокринолога (глюкоза > 10).", checklist: {}, files: {}, iol: null },
    { id: "P-003", fio: "Смирнов Дмитрий", district: "Шалинский", diagnosis: "H25.8", snils: "555-123-121 77", policy: "ОМС-00155", operation: "Факоэмульсификация", status: "green", stage: 3, surgeryDate: "2026-05-15", surgeonComment: "Готов к операции.", checklist: {}, files: {}, iol: null }
  ];

  const state = {
    role: localStorage.getItem("role") || "f",
    selectedPatient: localStorage.getItem("selectedPatient") || "P-001",
    offlineQueue: JSON.parse(localStorage.getItem("offlineQueue") || "[]"),
    online: navigator.onLine,
    patients: JSON.parse(localStorage.getItem("patients") || "null") || defaultPatients
  };

  function save() {
    localStorage.setItem("patients", JSON.stringify(state.patients));
    localStorage.setItem("role", state.role);
    localStorage.setItem("selectedPatient", state.selectedPatient);
    localStorage.setItem("offlineQueue", JSON.stringify(state.offlineQueue));
  }

  const badge = (status) => `<span class="badge ${status}">${status === "red" ? "Красный" : status === "yellow" ? "Желтый" : "Зеленый"}</span>`;
  const getPatient = () => state.patients.find(p => p.id === state.selectedPatient) || state.patients[0];
  const statusFromChecklist = (p) => {
    const items = operationTemplates[p.operation] || [];
    const done = items.filter(i => p.checklist[i]).length;
    if (done === items.length && done > 0) return "green";
    if (done === 0) return "red";
    return "yellow";
  };

  function calcIOL({k1,k2,acd,axial,aConst}) {
    const meanK = (k1 + k2) / 2;
    const srkT = aConst - 2.5 * axial - 0.9 * meanK;
    const haigis = (0.1 * (aConst - 118)) + (0.4 * acd) - (2.2 * axial) + 95 - meanK;
    return { srkT: srkT.toFixed(2), haigis: haigis.toFixed(2) };
  }

  function queueOrApply(action) {
    if (state.online) {
      action();
    } else {
      state.offlineQueue.push({ ts: Date.now(), action: action.toString() });
    }
    save(); render();
  }

  function syncQueue() {
    if (!state.online || state.offlineQueue.length === 0) return;
    state.offlineQueue = [];
    save();
  }

  function renderF() {
    const container = document.getElementById("viewF");
    const p = getPatient();
    const template = operationTemplates[p.operation] || [];

    container.innerHTML = `
      <div class="card">
        <h2>Панель районного офтальмолога</h2>
        <div class="pill small">Сеть: <b>${state.online ? "онлайн" : "оффлайн"}</b>. Несинхронизированных изменений: <b>${state.offlineQueue.length}</b></div>
        <table>
          <thead><tr><th>ID</th><th>ФИО</th><th>Район</th><th>Диагноз МКБ-10</th><th>Статус</th></tr></thead>
          <tbody>
            ${state.patients.map(row => `
              <tr>
                <td><button data-pid="${row.id}" class="btn-outline small">${row.id}</button></td>
                <td>${row.fio}</td>
                <td>${row.district}</td>
                <td>${row.diagnosis}</td>
                <td>${badge(row.status)}</td>
              </tr>`).join("")}
          </tbody>
        </table>
      </div>

      <div class="card">
        <h2>Карточка пациента ${p.fio}</h2>
        <div class="field-row small">
          <div><b>СНИЛС:</b> ${p.snils}</div>
          <div><b>Полис (ЕМИАС-заглушка):</b> ${p.policy}</div>
          <div><b>Тип операции:</b> ${p.operation}</div>
          <div><b>Комментарий хирурга:</b> ${p.surgeonComment || "—"}</div>
        </div>
        <h3>Чек-лист подготовки</h3>
        ${template.map(item => `
          <div class="check-item">
            <div class="check-head">
              <label><input type="checkbox" data-check="${item}" ${p.checklist[item] ? "checked" : ""}> ${item}</label>
              <span class="muted small">${p.files[item] ? "Файл: " + p.files[item] : "Файл не загружен"}</span>
            </div>
            <div class="small muted">Добавить файл/заключение: <input data-file="${item}" placeholder="имя файла.pdf / фото.jpg" value="${p.files[item] || ""}" /></div>
          </div>`).join("")}

        <h3>Калькулятор ИОЛ</h3>
        <div class="field-row-4 small">
          <input id="k1" placeholder="K1" type="number" step="0.01" />
          <input id="k2" placeholder="K2" type="number" step="0.01" />
          <input id="acd" placeholder="ACD" type="number" step="0.01" />
          <input id="axial" placeholder="Осевая длина" type="number" step="0.01" />
        </div>
        <div class="field-row small" style="margin-top:8px;">
          <input id="aconst" placeholder="A-constant" type="number" step="0.01" value="118.4" />
          <button id="calcIol" class="btn-primary">Рассчитать SRK/T и Haigis</button>
        </div>
        <div class="small" id="iolResult">${p.iol ? `SRK/T: <b>${p.iol.srkT} D</b>, Haigis: <b>${p.iol.haigis} D</b>` : "Расчет пока не выполнен"}</div>

        <h3>Мультимедиа + интеграции</h3>
        <div class="small muted">Фото щелевой лампы / глазного дна / кератотопограмма: загружаются как файлы в чек-листе. DICOM-подобные данные помечаются как "сжато" (MVP-симуляция).</div>
        <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
          <button id="compressMedia" class="btn-outline">Оптимизировать тяжелые снимки</button>
          <button id="sendToEhr" class="btn-outline">Отправить в ЕМИАС/РИАМС (заглушка)</button>
        </div>
      </div>
    `;

    container.querySelectorAll("[data-pid]").forEach(el => el.onclick = () => { state.selectedPatient = el.dataset.pid; save(); render(); });
    container.querySelectorAll("[data-check]").forEach(el => el.onchange = () => {
      const item = el.dataset.check;
      queueOrApply(() => {
        p.checklist[item] = el.checked;
        p.status = statusFromChecklist(p);
        p.stage = p.status === "green" ? 2 : p.status === "yellow" ? 2 : 1;
      });
    });
    container.querySelectorAll("[data-file]").forEach(el => el.onchange = () => {
      const item = el.dataset.file;
      queueOrApply(() => { p.files[item] = el.value.trim(); });
    });
    document.getElementById("calcIol").onclick = () => {
      const k1 = parseFloat(document.getElementById("k1").value);
      const k2 = parseFloat(document.getElementById("k2").value);
      const acd = parseFloat(document.getElementById("acd").value);
      const axial = parseFloat(document.getElementById("axial").value);
      const aConst = parseFloat(document.getElementById("aconst").value);
      if ([k1,k2,acd,axial,aConst].some(v => Number.isNaN(v))) { alert("Заполните параметры глаза"); return; }
      queueOrApply(() => {
        p.iol = calcIOL({k1,k2,acd,axial,aConst});
        p.checklist["Расчет ИОЛ"] = true;
        p.status = statusFromChecklist(p);
      });
    };
    document.getElementById("compressMedia").onclick = () => alert("MVP: тяжелые изображения отмечены как оптимизированные для слабого канала связи.");
    document.getElementById("sendToEhr").onclick = () => alert("MVP: данные отправлены в ЕМИАС/РИАМС через интеграционный шлюз (заглушка).\nFHIR поля patient.identifier, condition.code, procedure.code подготовлены.");
  }

  function renderS() {
    const container = document.getElementById("viewS");
    container.innerHTML = `
      <div class="card">
        <h2>Кабинет хирурга (модерация)</h2>
        <table>
          <thead><tr><th>ID</th><th>Пациент</th><th>Район</th><th>Статус</th><th>Дата операции</th><th>Действие</th></tr></thead>
          <tbody>
            ${state.patients.map(p => `
              <tr>
                <td>${p.id}</td>
                <td>${p.fio}</td>
                <td>${p.district}</td>
                <td>${badge(p.status)}</td>
                <td><input data-date="${p.id}" type="date" value="${p.surgeryDate || ""}" /></td>
                <td>
                  <button class="btn-primary" data-ok="${p.id}">Подтвердить готовность</button>
                  <button class="btn-outline" data-req="${p.id}">Запросить дообследование</button>
                </td>
              </tr>
              <tr><td colspan="6"><textarea data-comment="${p.id}" placeholder="Комментарий районному коллеге">${p.surgeonComment || ""}</textarea></td></tr>
            `).join("")}
          </tbody>
        </table>
      </div>`;

    container.querySelectorAll("[data-date]").forEach(el => el.onchange = () => {
      const p = state.patients.find(x => x.id === el.dataset.date);
      queueOrApply(() => { p.surgeryDate = el.value; if (el.value) p.stage = 3; });
    });
    container.querySelectorAll("[data-comment]").forEach(el => el.onchange = () => {
      const p = state.patients.find(x => x.id === el.dataset.comment);
      queueOrApply(() => { p.surgeonComment = el.value; });
    });
    container.querySelectorAll("[data-ok]").forEach(el => el.onclick = () => {
      const p = state.patients.find(x => x.id === el.dataset.ok);
      queueOrApply(() => { p.status = "green"; p.stage = 3; if (!p.surgeryDate) p.surgeryDate = new Date(Date.now()+1000*3600*24*14).toISOString().slice(0,10); });
    });
    container.querySelectorAll("[data-req]").forEach(el => el.onclick = () => {
      const p = state.patients.find(x => x.id === el.dataset.req);
      queueOrApply(() => { p.status = "red"; p.stage = 1; if (!p.surgeonComment) p.surgeonComment = "Требуется дополнительная консультация."; });
    });
  }

  function renderP() {
    const p = getPatient();
    const container = document.getElementById("viewP");
    container.innerHTML = `
      <div class="card">
        <h2>Пациентский интерфейс</h2>
        <div class="small muted">Вход по короткому коду (MVP): <b>${p.id}</b></div>
        <div style="margin:8px 0;">Текущий статус: ${badge(p.status)}</div>
        <ul class="timeline">
          <li><b>Этап 1:</b> Анализы в районной поликлинике — ${p.stage > 1 ? "завершено" : "в процессе"}</li>
          <li><b>Этап 2:</b> Проверка хирургом — ${p.stage > 2 ? "завершено" : "ожидание"}</li>
          <li><b>Этап 3:</b> Операция ${p.surgeryDate ? "назначена на " + p.surgeryDate : "еще не назначена"}</li>
        </ul>
        <div class="small muted">Telegram-бот (заглушка): отправляет напоминания «Завтра сдать кровь натощак» и уведомления об изменении статуса.</div>
        <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
          <button id="tgPing" class="btn-primary">Проверить уведомление Telegram</button>
          <button id="printRoute" class="btn-outline">Сформировать лист маршрутизации</button>
          <button id="videoCall" class="btn-outline">Запуск видеоконсультации (WebRTC-заглушка)</button>
        </div>
      </div>
    `;

    document.getElementById("tgPing").onclick = () => alert("Telegram: Напоминание отправлено пациенту.");
    document.getElementById("printRoute").onclick = () => {
      const route = `Лист маршрутизации\\nПациент: ${p.fio}\\nОперация: ${p.operation}\\nСтатус: ${p.status}\\nДата операции: ${p.surgeryDate || "не назначена"}`;
      const w = window.open("", "_blank");
      w.document.write(`<pre>${route}</pre>`); w.print();
    };
    document.getElementById("videoCall").onclick = () => alert("MVP: вызов через встроенный мессенджер/WebRTC инициирован (заглушка).");
  }

  function render() {
    document.getElementById("viewF").style.display = state.role === "f" ? "grid" : "none";
    document.getElementById("viewS").style.display = state.role === "s" ? "grid" : "none";
    document.getElementById("viewP").style.display = state.role === "p" ? "grid" : "none";

    document.getElementById("roleF").classList.toggle("active-role", state.role === "f");
    document.getElementById("roleS").classList.toggle("active-role", state.role === "s");
    document.getElementById("roleP").classList.toggle("active-role", state.role === "p");

    if (state.role === "f") renderF();
    if (state.role === "s") renderS();
    if (state.role === "p") renderP();
  }

  document.getElementById("roleF").onclick = () => { state.role = "f"; save(); render(); };
  document.getElementById("roleS").onclick = () => { state.role = "s"; save(); render(); };
  document.getElementById("roleP").onclick = () => { state.role = "p"; save(); render(); };

  window.addEventListener("online", () => { state.online = true; syncQueue(); render(); });
  window.addEventListener("offline", () => { state.online = false; save(); render(); });

  render();
})();
</script>
</body>
</html>
